<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">店舗やカフェの雰囲気を伝えるビジュアル</title>
  <desc id="desc">カウンター、窓辺、やわらかな照明を抽象的に描いたオリジナルの写真風ビジュアル。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffaf5"/><stop offset=".55" stop-color="#eee5da"/><stop offset="1" stop-color="#cfc5b9"/></linearGradient>
    <radialGradient id="light" cx="38%" cy="12%" r="62%"><stop stop-color="#ffffff"/><stop offset=".38" stop-color="#ffd4ad" stop-opacity=".46"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#23170f" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="820" fill="url(#bg)"/>
  <rect width="1200" height="820" fill="url(#light)"/>
  <rect x="0" y="500" width="1200" height="320" fill="#f7f0e8" opacity=".75"/>
  <g filter="url(#shadow)">
    <rect x="172" y="176" width="356" height="320" rx="42" fill="#ffffff" opacity=".86"/>
    <rect x="218" y="222" width="264" height="170" rx="28" fill="#111113" opacity=".9"/>
    <circle cx="300" cy="307" r="48" fill="#ff7a1a" opacity=".18"/>
    <rect x="248" y="420" width="162" height="16" rx="8" fill="#111113" opacity=".7"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="616" y="238" width="356" height="404" rx="48" fill="#fdfdfd" opacity=".92"/>
    <rect x="660" y="286" width="268" height="212" rx="34" fill="#d9caba"/>
    <path d="M660 456c78-82 160-96 268-34v76H660z" fill="#ff8c42" opacity=".16"/>
    <rect x="660" y="536" width="196" height="16" rx="8" fill="#111113" opacity=".76"/>
    <rect x="660" y="574" width="132" height="11" rx="6" fill="#111113" opacity=".18"/>
  </g>
  <path d="M120 670c196-64 330-66 524-4 162 52 288 38 436-38" fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" opacity=".44"/>
</svg>
