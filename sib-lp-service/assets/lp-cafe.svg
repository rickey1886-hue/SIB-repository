<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
  <title id="title">落ち着いた店舗空間</title>
  <desc id="desc">カフェや店舗の雰囲気を想起させる、暖かい光とカウンターの写真風ビジュアル。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#efece6"/><stop offset="0.5" stop-color="#c7b8a5"/><stop offset="1" stop-color="#6e6258"/></linearGradient>
    <radialGradient id="lamp" cx="34%" cy="12%" r="42%"><stop stop-color="#fff5df"/><stop offset="0.45" stop-color="#ff8c42" stop-opacity="0.34"/><stop offset="1" stop-color="#ff8c42" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#111113" flood-opacity="0.18"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1000" height="900" fill="url(#bg)"/>
  <rect width="1000" height="900" fill="url(#lamp)"/>
  <rect x="0" y="520" width="1000" height="380" fill="#5f5148" opacity="0.5"/>
  <g opacity="0.55">
    <rect x="110" y="160" width="180" height="270" rx="22" fill="#f7f0e8"/>
    <rect x="360" y="128" width="180" height="300" rx="22" fill="#f7f0e8"/>
    <rect x="610" y="176" width="180" height="250" rx="22" fill="#f7f0e8"/>
  </g>
  <circle cx="248" cy="150" r="86" fill="#fff4da" opacity="0.72" filter="url(#blur)"/>
  <circle cx="500" cy="130" r="76" fill="#fff4da" opacity="0.56" filter="url(#blur)"/>
  <g filter="url(#shadow)">
    <rect x="145" y="548" width="710" height="170" rx="42" fill="#d1b89d"/>
    <rect x="188" y="512" width="180" height="72" rx="36" fill="#f6efe6"/>
    <rect x="430" y="498" width="240" height="86" rx="43" fill="#efe4d8"/>
    <circle cx="250" cy="474" r="54" fill="#2a2522" opacity="0.58"/>
    <circle cx="544" cy="454" r="64" fill="#2a2522" opacity="0.48"/>
    <rect x="670" y="402" width="124" height="196" rx="42" fill="#201c1a" opacity="0.7"/>
  </g>
  <rect x="170" y="690" width="660" height="10" rx="5" fill="#fff" opacity="0.32"/>
  <circle cx="825" cy="240" r="82" fill="#fff" opacity="0.2" filter="url(#blur)"/>
</svg>
