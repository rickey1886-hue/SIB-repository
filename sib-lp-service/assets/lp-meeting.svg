<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">打ち合わせでLPの構成を整理する様子</title>
  <desc id="desc">テーブル上の資料、コーヒー、手元を抽象的に表現したオリジナルの写真風ビジュアル。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7f7f8"/><stop offset=".52" stop-color="#ebecee"/><stop offset="1" stop-color="#d7d9dd"/></linearGradient>
    <radialGradient id="warm" cx="78%" cy="18%" r="55%"><stop stop-color="#ffe8d8"/><stop offset=".52" stop-color="#ff8c42" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#111113" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="820" fill="url(#bg)"/>
  <rect width="1200" height="820" fill="url(#warm)"/>
  <rect x="140" y="166" width="920" height="516" rx="56" fill="#fbfbfd" opacity=".82" filter="url(#shadow)"/>
