    <circle cx="760" cy="340" r="48" fill="#f8f2ea"/>
    <circle cx="760" cy="340" r="26" fill="#d8a16f" opacity=".7"/>
    <rect x="668" y="470" width="258" height="74" rx="37" fill="#111113" opacity=".86"/>
