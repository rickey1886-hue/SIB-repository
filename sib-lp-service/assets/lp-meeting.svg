<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
  <title id="title">少人数の打ち合わせ</title>
  <desc id="desc">テーブル上の資料とスマートフォンを囲む、少人数の打ち合わせの写真風ビジュアル。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7f6f3"/><stop offset="1" stop-color="#b8b1a8"/></linearGradient>
    <radialGradient id="warm" cx="80%" cy="20%" r="70%"><stop stop-color="#ffdec0"/><stop offset="0.5" stop-color="#ff8c42" stop-opacity="0.18"/><stop offset="1" stop-color="#111113" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#111113" flood-opacity="0.18"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1000" height="900" fill="url(#bg)"/>
  <rect width="1000" height="900" fill="url(#warm)"/>
  <circle cx="164" cy="132" r="154" fill="#fff" opacity="0.32" filter="url(#blur)"/>
  <rect x="80" y="470" width="840" height="330" rx="58" fill="#d9d2c8" opacity="0.82"/>
  <g filter="url(#shadow)">
    <rect x="250" y="238" width="500" height="390" rx="38" fill="#fdfdfd" transform="rotate(-3 500 433)"/>
    <rect x="304" y="302" width="250" height="24" rx="12" fill="#151517" opacity="0.78" transform="rotate(-3 500 433)"/>
    <rect x="304" y="366" width="392" height="12" rx="6" fill="#d0d0d6" transform="rotate(-3 500 433)"/>
    <rect x="304" y="404" width="310" height="12" rx="6" fill="#d0d0d6" transform="rotate(-3 500 433)"/>
    <rect x="304" y="476" width="150" height="96" rx="22" fill="#ff8c42" opacity="0.2" transform="rotate(-3 500 433)"/>
    <rect x="486" y="476" width="150" height="96" rx="22" fill="#111113" opacity="0.1" transform="rotate(-3 500 433)"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="575" y="418" width="150" height="270" rx="32" fill="#19191c" transform="rotate(8 650 553)"/>
    <rect x="590" y="450" width="120" height="218" rx="20" fill="#f7f7f8" transform="rotate(8 650 553)"/>
