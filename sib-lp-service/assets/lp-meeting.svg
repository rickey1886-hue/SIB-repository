  <path d="M934 294c-120 54-170 144-178 276" fill="none" stroke="#4a413b" stroke-width="78" stroke-linecap="round" opacity="0.34"/>
  <circle cx="236" cy="190" r="74" fill="#c9b9aa" opacity="0.86"/>
  <circle cx="788" cy="172" r="74" fill="#8f8175" opacity="0.66"/>
</svg>
